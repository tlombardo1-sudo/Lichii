# Compiles the Xbox (UWP x64) port on a GitHub-hosted Windows runner, so no local Store toolchain is
# needed. No signing secrets are required: this only builds, and uploads the full log plus the
# binaries. Run it from Actions > uwp-build > Run workflow, or by pushing to nx2uwp.

name: uwp-build

on:
  workflow_dispatch:
    inputs:
      keep_going:
        description: Keep compiling after the first error (collects every error in one run)
        type: boolean
        default: true
      symbolize_run_id:
        description: "Symbolize a crash instead of building: uwp-build run id whose jadyx-build artifact matches"
        type: string
        default: ""
      symbolize_offsets:
        description: "Crash-stack offsets from jadyx_diag.txt, space separated (e.g. +0xd4d8d1 +0xd4a05b)"
        type: string
        default: ""
  push:
    branches:
      - nx2uwp
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeModules/**"
      - "externals/**"
      - "tools/xbox/**"
      - "cpmfile.json"
      - ".github/workflows/uwp-build.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: uwp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lichii (UWP x64)
    if: ${{ inputs.symbolize_run_id == '' }}
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.cache\sccache
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # build-env.bat picks these up from C:\glslang\bin and C:\Program Files\NASM. With jom on the
      # PATH, OpenSSL builds on every core instead of single-threaded nmake.
      - name: Host tools (glslang, NASM, jom)
        id: tools
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "glslang.zip"
          $url = "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip"
          $ok = $false
          # GitHub's release CDN sometimes returns 504 for minutes; retry, then fall back.
          for ($attempt = 1; $attempt -le 4 -and -not $ok; $attempt++) {
              try {
                  Invoke-WebRequest $url -OutFile $zip
                  if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "82BF434E69B9BB4829DE7E2B4BC2C5E7A7861E53D66CF75E5CC70F5F694A8D9B") {
                      throw "glslang checksum mismatch"
                  }
                  $ok = $true
              } catch {
                  Write-Host "glslang download failed ($($_.Exception.Message)); attempt $attempt of 4"
                  if ($attempt -lt 4) { Start-Sleep -Seconds ($attempt * 15) }
              }
          }
          New-Item -ItemType Directory -Force C:\glslang\bin | Out-Null
          if ($ok) {
              Expand-Archive $zip C:\glslang -Force
              Copy-Item C:\glslang\bin\glslang.exe C:\glslang\bin\glslangValidator.exe
          } else {
              Write-Host "Falling back to the Vulkan SDK's glslangValidator"
              $validator = $null
              if ($env:VULKAN_SDK) { $validator = Join-Path $env:VULKAN_SDK "Bin\glslangValidator.exe" }
              if (-not $validator -or -not (Test-Path $validator)) {
                  choco install vulkan-sdk -y --no-progress
                  $sdk = Get-ChildItem C:\VulkanSDK -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
                  if ($sdk) { $validator = Join-Path $sdk.FullName "Bin\glslangValidator.exe" }
              }
              if (-not $validator -or -not (Test-Path $validator)) { throw "No glslangValidator available" }
              Copy-Item $validator C:\glslang\bin\glslangValidator.exe
          }
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe")) { choco install nasm -y --no-progress }
          if (-not (Get-Command jom -ErrorAction SilentlyContinue)) { choco install jom -y --no-progress }
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl is missing from the runner" }
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore CPM sources
        id: cpm
        uses: actions/cache/restore@v4
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/sccache
          key: sccache-uwp-${{ github.run_id }}
          restore-keys: sccache-uwp-

      - name: Restore OpenSSL build
        id: openssl
        uses: actions/cache/restore@v4
        with:
          path: build-uwp/_deps/openssl-build
          key: openssl-uwp-${{ steps.tools.outputs.image }}-${{ hashFiles('cpmfile.json', 'CMakePresets.json', 'CMakeLists.txt', 'CMakeModules/**') }}

      # The compiler cache only speeds rebuilds; a failed download (GitHub's release CDN 504s at
      # times) must not fail the build, which then runs without it.
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
        with:
          disable_annotations: true

      - name: Configure
        shell: pwsh
        run: |
          $cache = ""
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
              $cache = "-DUSE_CCACHE=ON -DCCACHE_BINARY=sccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          } else {
              Write-Host "sccache is not available: building without the compiler cache"
          }
          # Configure downloads dependencies from GitHub releases, which 504 at times; downloaded
          # packages are kept, so a retry only repeats the part that failed.
          for ($attempt = 1; $attempt -le 4; $attempt++) {
              cmd /c "tools\xbox\build-env.bat cmake --preset uwp-x64 $cache" 2>&1 | Tee-Object configure.log -Append:($attempt -gt 1)
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -lt 4) {
                  Write-Host "Configure failed (attempt $attempt of 4); retrying in $($attempt * 30)s"
                  Start-Sleep -Seconds ($attempt * 30)
              }
          }
          exit $LASTEXITCODE

      # -k 0 makes Ninja keep going past failures so one run reports every compile error.
      - name: Build
        shell: pwsh
        run: |
          $keep = if ("${{ inputs.keep_going }}" -eq "false") { "" } else { "-- -k 0" }
          cmd /c "tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target jadyx $keep" 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE

      - name: Summarize errors
        if: always()
        shell: pwsh
        run: |
          $errors = @()
          foreach ($f in "configure.log", "build.log") {
              if (Test-Path $f) {
                  $errors += Select-String -Path $f -Pattern ': (fatal )?error [A-Z]+\d+|CMake Error|ninja: build stopped|LINK : fatal|FAILED:' | ForEach-Object { $_.Line }
              }
          }
          $errors = $errors | Select-Object -Unique
          $fence = '```'
          "### Build errors ($($errors.Count))`n$fence`n$(($errors | Select-Object -First 300) -join "`n")`n$fence" >> $env:GITHUB_STEP_SUMMARY
          $errors | Set-Content errors.txt

      - name: Compiler cache stats
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          sccache --show-stats
          sccache --stop-server

      - name: Save CPM sources
        if: always() && steps.cpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/cpm
          key: ${{ steps.cpm.outputs.cache-primary-key }}

      - name: Save OpenSSL build
        if: always() && steps.openssl.outputs.cache-hit != 'true' && hashFiles('build-uwp/_deps/openssl-build/libcrypto.lib') != ''
        uses: actions/cache/save@v4
        with:
          path: build-uwp/_deps/openssl-build
          key: ${{ steps.openssl.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/sccache
          key: sccache-uwp-${{ github.run_id }}

      # Logs upload even when the build fails; they are the point of the first runs.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 14
          if-no-files-found: warn
          path: |
            configure.log
            build.log
            errors.txt
            build-uwp/CMakeFiles/CMakeConfigureLog.yaml
            build-uwp/CMakeFiles/CMakeError.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: jadyx-build
          retention-days: 7
          if-no-files-found: error
          path: |
            build-uwp/bin/jadyx.exe
            build-uwp/bin/jadyx.pdb
            build-uwp/bin/*.dll

  # Mesa's SPIR-V -> DXIL translator for the D3D12 renderer. Cached on its inputs. A failure here
  # does not stop the package: the renderer then presents through its CPU fallback.
  mesa:
    if: ${{ inputs.symbolize_run_id == '' }}
    name: spirv_to_dxil
    runs-on: windows-2025
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Restore the built DLL
        id: cache
        uses: actions/cache@v4
        with:
          path: mesa-out
          key: spirv-to-dxil-${{ hashFiles('tools/xbox/build-spirv-to-dxil.ps1', 'tools/xbox/mesa/**', 'externals/spirv-to-dxil/include/**') }}

      - name: Build spirv_to_dxil.dll
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mesa-build"
          & tools\xbox\build-spirv-to-dxil.ps1 -WorkDir $work
          New-Item -ItemType Directory -Force mesa-out | Out-Null
          Copy-Item (Join-Path $work "build-uwp\src\microsoft\spirv_to_dxil\spirv_to_dxil.dll") mesa-out

      - uses: actions/upload-artifact@v4
        with:
          name: spirv-to-dxil
          path: mesa-out/spirv_to_dxil.dll
          if-no-files-found: error
          retention-days: 7

  # A sideloadable test package, signed with a throw-away self-signed certificate made here. It
  # installs on a console in Dev Mode after the .cer is uploaded. It is the Canary identity
  # (Jadyx.Canary, tile "Jadyx Canary"), so it never replaces an installed Jadyx.
  package:
    name: appx (self-signed test package)
    needs: [build, mesa]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jadyx-build
          path: build-uwp/bin

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spirv-to-dxil
          path: ${{ runner.temp }}/mesa

      - name: Pack and sign
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # The subject has to match Identity/@Publisher in dist/uwp/AppxManifest.xml.
          $publisher = "CN=JadyxDev"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
              -KeyUsage DigitalSignature -FriendlyName "Lichii test package" `
              -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(2) `
              -TextExtension @("2.5.29.19={text}", "2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = [Guid]::NewGuid().ToString("N")
          $pfx = Join-Path $env:RUNNER_TEMP "lichii-test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
              -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          $env:JADYX_PFX_PASSWORD = $password
          # Canary: identity Jadyx.Canary, so it installs next to Jadyx with its own app data.
          $params = @{ Library = $true; Canary = $true; PfxPath = $pfx; BootCfg = @("guest_swap=0") }
          $dll = Join-Path $env:RUNNER_TEMP "mesa\spirv_to_dxil.dll"
          if (Test-Path $dll) { $params.SpirvToDxil = $dll } else { Write-Warning "No spirv_to_dxil.dll: the package presents through the CPU path" }
          try { & tools\xbox\package-appx.ps1 @params } finally { Remove-Item $pfx -Force }
          $out = New-Item -ItemType Directory -Force out
          Copy-Item build-uwp\package\jadyx.appx out\Lichii_test_x64.appx
          Copy-Item build-uwp\package\jadyx.cer out\Lichii_test.cer
          if (Test-Path build-uwp\package\Microsoft.VCLibs.x64.14.00.appx) {
              Copy-Item build-uwp\package\Microsoft.VCLibs.x64.14.00.appx out\
          }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: lichii-test-package
          path: out/*
          if-no-files-found: error
          retention-days: 14

  symbolize:
    if: ${{ inputs.symbolize_run_id != '' }}
    runs-on: windows-2022
    steps:
      - name: Download the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.symbolize_run_id }}" -R "${{ github.repository }}" -n jadyx-build -D build
      - name: Symbolize
        shell: bash
        run: |
          ls -la build
          SYM="/c/Program Files/LLVM/bin/llvm-symbolizer.exe"
          [ -x "$SYM" ] || SYM="$(command -v llvm-symbolizer || true)"
          echo "symbolizer: $SYM"
          exe="$(ls build/*.exe | head -1)"
          out=""
          for o in ${{ inputs.symbolize_offsets }}; do
            o="${o#+}"
            res="$("$SYM" --obj="$exe" --relative-address --inlining --demangle "$o" 2>&1 | head -6 | tr '\n' ' ')"
            line="$o => $res"
            echo "$line"
            echo "::notice title=frame::$line"
            out="$out$line"$'\n'
          done
          # Disassembly around the first two frames: shows which call sits at the return address.
          OBJDUMP="$(dirname "$SYM")/llvm-objdump.exe"
          base="$("$OBJDUMP" -p "$exe" | grep -i '^ImageBase' | awk '{print $2}')"
          echo "image base: $base"
          n=0
          for o in ${{ inputs.symbolize_offsets }}; do
            n=$((n+1)); [ $n -gt 2 ] && break
            o="${o#+}"
            start=$(printf '0x%x' $(( base + o - 0x70 )))
            stop=$(printf '0x%x' $(( base + o + 0x10 )))
            dis="$("$OBJDUMP" -d --no-show-raw-insn -C --start-address=$start --stop-address=$stop "$exe" 2>&1 | tail -n +4 | tr '\n' '|')"
            echo "::notice title=disasm $o::$dis"
          done
          { echo '### Symbolized crash stack'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
