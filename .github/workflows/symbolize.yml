name: symbolize

# Turn crash-stack offsets from jadyx_diag.txt (the "+0x..." entries) into function names, using the
# exe and pdb that a uwp-build run published. Result goes to the job summary and as annotations.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "uwp-build run id whose jadyx-build artifact matches the crash"
        required: true
      offsets:
        description: "Space separated offsets from the crash stack, e.g. +0xd4d8d1 +0xd4a05b"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  symbolize:
    runs-on: windows-2022
    steps:
      - name: Download the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n jadyx-build -D build
      - name: Symbolize
        shell: bash
        run: |
          ls -la build
          SYM="/c/Program Files/LLVM/bin/llvm-symbolizer.exe"
          [ -x "$SYM" ] || SYM="$(command -v llvm-symbolizer || true)"
          echo "symbolizer: $SYM"
          exe="$(ls build/*.exe | head -1)"
          out=""
          for o in ${{ inputs.offsets }}; do
            o="${o#+}"
            res="$("$SYM" --obj="$exe" --relative-address --inlining --demangle "$o" 2>&1 | head -6 | tr '\n' ' ')"
            line="$o => $res"
            echo "$line"
            echo "::notice title=frame::$line"
            out="$out$line"$'\n'
          done
          { echo '### Symbolized crash stack'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
